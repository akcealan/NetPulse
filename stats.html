<!DOCTYPE html>
<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NetPulse - İstatistikler</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5D9CEC",
                        "background-light": "#F9FAFB",
                        "background-dark": "#1F2937",
                        "text-light": "#333333",
                        "text-dark": "#F9FAFB",
                        "container-dark": "#1F2937",
                        "success": "#4CAF50",
                        "danger": "#e73908"
                    },
                    fontFamily: {
                        "display": ["Poppins", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark font-body">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<header class="sticky top-0 z-10 flex items-center justify-between whitespace-nowrap border-b border-gray-200/80 dark:border-gray-700/80 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm px-6 lg:px-10 py-3">
<div class="flex items-center gap-4 text-text-light dark:text-text-dark">
<div class="size-7 text-primary">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-xl font-bold leading-tight tracking-[-0.015em]">NetPulse</h2>
</div>
<div class="hidden lg:flex flex-1 justify-center gap-8">
<a class="text-text-light/80 dark:text-text-dark/80 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="index.html">Panel</a>
<a class="text-text-light/80 dark:text-text-dark/80 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="dataentry.html">Veri Girişi</a>
<a class="text-primary text-sm font-medium leading-normal" href="stats.html">İstatistikler</a>
<a class="text-text-light/80 dark:text-text-dark/80 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="timer.html">Kronometre</a>
<a class="text-text-light/80 dark:text-text-dark/80 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="settings.html">Ayarlar</a>
</div>
<div class="flex items-center gap-4">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 w-10 bg-gray-200/70 dark:bg-gray-700/70 text-text-light dark:text-text-dark hover:bg-gray-300 dark:hover:bg-gray-600">
<span class="material-symbols-outlined dark:hidden">dark_mode</span>
<span class="material-symbols-outlined hidden dark:inline">light_mode</span>
</button>
<button class="lg:hidden flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 w-10 bg-gray-200/70 dark:bg-gray-700/70 text-text-light dark:text-text-dark hover:bg-gray-300 dark:hover:bg-gray-600">
<span class="material-symbols-outlined">menu</span>
</button>
</div>
</header>
<div class="px-4 sm:px-6 lg:px-8 flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col w-full max-w-6xl flex-1">
<div class="flex flex-wrap justify-between items-center gap-4 p-4">
<h1 class="text-text-light dark:text-text-dark text-3xl md:text-4xl font-display font-bold">NetPulse İstatistikleri</h1>
</div>
            
            <!-- Filtre Butonları -->
            <div class="flex flex-wrap gap-2 p-4">
                <button data-filter="all" class="px-4 py-2 rounded-lg font-medium transition-colors bg-primary text-white">
                    Tüm Zamanlar
                </button>
                <button data-filter="today" class="px-4 py-2 rounded-lg font-medium transition-colors bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
                    Bugün
                </button>
                <button data-filter="week" class="px-4 py-2 rounded-lg font-medium transition-colors bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
                    Bu Hafta
                </button>
                <button data-filter="month" class="px-4 py-2 rounded-lg font-medium transition-colors bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
                    Bu Ay
                </button>
            </div>
            
            <!-- Genel İstatistikler -->
            <div id="generalStats" class="p-4">
                <!-- Dinamik yüklenecek -->
            </div>
            
            <div id="courseStatsSection" class="grid grid-cols-1 lg:grid-cols-3 gap-6 p-4">
                <!-- Ders Bazlı İstatistikler -->
                <div class="lg:col-span-2">
                    <h2 class="text-xl font-bold text-text-light dark:text-text-dark mb-4">Ders Bazlı Analiz</h2>
                    <div id="courseStats" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Dinamik yüklenecek -->
                    </div>
                </div>
                
                <!-- Performans Özeti -->
                <div>
                    <h2 class="text-xl font-bold text-text-light dark:text-text-dark mb-4">Performans Özeti</h2>
                    <div id="performanceSummary">
                        <!-- Dinamik yüklenecek -->
                    </div>
                </div>
            </div>
            
            <!-- Konu Bazlı İstatistikler -->
            <div id="topicStatsSection" class="p-4">
                <h2 class="text-xl font-bold text-text-light dark:text-text-dark mb-4">Konu Bazlı Analiz</h2>
                <div id="topicStats">
                    <!-- Dinamik yüklenecek -->
                </div>
            </div>
            
            <!-- Trend Analizi -->
            <div id="trendAnalysisSection" class="p-4">
                <div id="trendAnalysis">
                    <!-- Dinamik yüklenecek -->
                </div>
            </div>
            
            <!-- Detaylı Metrikler -->
            <div id="detailedMetricsSection" class="p-4">
                <h2 class="text-xl font-bold text-text-light dark:text-text-dark mb-4">Detaylı Metrikler</h2>
                <div id="detailedMetrics">
                    <!-- Dinamik yüklenecek -->
                </div>
            </div>
</div>
</div>
</div>
</div>
</div>
<script src="js/storage.js"></script>
<script src="js/stats.js"></script>
<script src="js/theme.js"></script>
</body></html>
