<!DOCTYPE html>
<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NetPulse - Panel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5D9CEC",
                        "success": "#4CAF50",
                        "background-light": "#F9FAFB",
                        "background-dark": "#1F2937",
                        "text-light": "#333333",
                        "text-dark": "#F9FAFB"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<header class="sticky top-0 z-10 flex items-center justify-between whitespace-nowrap border-b border-gray-200/80 dark:border-gray-700/80 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm px-6 lg:px-10 py-3">
<div class="flex items-center gap-4 text-text-light dark:text-text-dark">
<div class="size-7 text-primary">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-xl font-bold leading-tight tracking-[-0.015em]">NetPulse</h2>
</div>
<div class="hidden lg:flex flex-1 justify-center gap-8">
<a class="text-primary text-sm font-medium leading-normal" href="index.html">Panel</a>
<a class="text-text-light/80 dark:text-text-dark/80 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="dataentry.html">Veri Girişi</a>
<a class="text-text-light/80 dark:text-text-dark/80 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="stats.html">İstatistikler</a>
<a class="text-text-light/80 dark:text-text-dark/80 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="timer.html">Kronometre</a>
<a class="text-text-light/80 dark:text-text-dark/80 hover:text-primary dark:hover:text-primary text-sm font-medium leading-normal" href="settings.html">Ayarlar</a>
</div>
<div class="flex items-center gap-4">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 w-10 bg-gray-200/70 dark:bg-gray-700/70 text-text-light dark:text-text-dark hover:bg-gray-300 dark:hover:bg-gray-600">
<span class="material-symbols-outlined dark:hidden">dark_mode</span>
<span class="material-symbols-outlined hidden dark:inline">light_mode</span>
</button>
<button class="lg:hidden flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 w-10 bg-gray-200/70 dark:bg-gray-700/70 text-text-light dark:text-text-dark hover:bg-gray-300 dark:hover:bg-gray-600">
<span class="material-symbols-outlined">menu</span>
</button>
</div>
</header>
<main class="flex-1 px-4 sm:px-6 lg:px-10 py-8">
<div class="mx-auto max-w-5xl">
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
<div class="flex flex-col gap-2 rounded-lg p-6 bg-white dark:bg-gray-800/50 shadow-sm border border-gray-200 dark:border-gray-700/50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl">functions</span>
<p class="text-text-light/80 dark:text-text-dark/80 text-base font-medium leading-normal">Toplam Soru</p>
</div>
<p id="totalQuestions" class="text-text-light dark:text-text-dark tracking-light text-4xl font-bold leading-tight">0</p>
</div>
<div class="flex flex-col gap-2 rounded-lg p-6 bg-white dark:bg-gray-800/50 shadow-sm border border-gray-200 dark:border-gray-700/50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-success text-3xl">check_circle</span>
<p class="text-text-light/80 dark:text-text-dark/80 text-base font-medium leading-normal">Toplam Doğru</p>
</div>
<p id="totalCorrect" class="text-success tracking-light text-4xl font-bold leading-tight">0</p>
</div>
<div class="flex flex-col gap-2 rounded-lg p-6 bg-white dark:bg-gray-800/50 shadow-sm border border-gray-200 dark:border-gray-700/50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl">timer</span>
<p class="text-text-light/80 dark:text-text-dark/80 text-base font-medium leading-normal">Toplam Süre</p>
</div>
<p id="totalDuration" class="text-text-light dark:text-text-dark tracking-light text-4xl font-bold leading-tight">0dk</p>
</div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="lg:col-span-2 flex flex-col gap-6">
<div class="flex flex-col gap-4 p-6 rounded-lg bg-white dark:bg-gray-800/50 shadow-sm border border-gray-200 dark:border-gray-700/50">
<div class="flex gap-6 justify-between items-center">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal">Bugünkü Çalışma</p>
<p id="todayPercentage" class="text-primary text-sm font-semibold leading-normal">0%</p>
</div>
<div class="w-full rounded-full bg-gray-200 dark:bg-gray-700">
<div id="todayProgressBar" class="h-2.5 rounded-full bg-primary transition-all duration-500" style="width: 0%;"></div>
</div>
<p id="todayStats" class="text-text-light/70 dark:text-text-dark/70 text-sm">Bugün henüz çalışma kaydı yok</p>
</div>
<div class="flex flex-col gap-2 p-6 rounded-lg bg-white dark:bg-gray-800/50 shadow-sm border border-gray-200 dark:border-gray-700/50">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal">Son Çalışmalar</p>
<div id="recentSessions" class="flex flex-col gap-3 py-4">
<!-- Recent sessions will be loaded here -->
</div>
</div>
</div>
<div class="flex flex-col gap-6">
<div class="flex flex-col gap-4 p-6 rounded-lg bg-white dark:bg-gray-800/50 shadow-sm border border-gray-200 dark:border-gray-700/50">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal">Ders Dağılımı</p>
<div id="courseDistribution" class="flex flex-col gap-3 py-2">
<!-- Course distribution will be loaded here -->
</div>
</div>
<div class="flex flex-col justify-center items-center text-center gap-4 p-6 rounded-lg bg-white dark:bg-gray-800/50 shadow-sm border border-gray-200 dark:border-gray-700/50">
<span class="material-symbols-outlined text-primary text-5xl">format_quote</span>
<p class="text-text-light dark:text-text-dark text-lg font-medium leading-relaxed">Öne geçmenin sırrı başlamaktır.</p>
<p class="text-text-light/60 dark:text-text-dark/60 text-sm">- Mark Twain</p>
</div>
</div>
</div>
</div>
</main>
</div>
</div>
<script src="js/storage.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/theme.js"></script>
</body></html>
